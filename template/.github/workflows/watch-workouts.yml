name: Watch workouts

# Puts today's workouts on your Garmin watch just after midnight (Central time), and again
# whenever the app sees you change today's workout. Past workouts it added are deleted.
on:
  schedule:
    # GitHub schedules run in UTC and often start a few minutes late. Midnight in Chicago is
    # 06:00 UTC in winter and 05:00 UTC in summer, so these cover just after midnight in both.
    - cron: "7 5 * * *"
    - cron: "37 5 * * *"
    - cron: "7 6 * * *"
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch-workouts
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Get the plan engine (public app repo)
        uses: actions/checkout@v4
        with:
          repository: abohn94/run-plan
          path: app

      - name: Work out today's workouts
        run: |
          python3 app/source/build.py > /dev/null
          node scripts/watch_plan.js app/source/dist/engine.built.js > /tmp/spec.json
          python3 scripts/garmin_workouts.py check /tmp/spec.json
        id: plan

      - name: Set up Python
        if: steps.plan.outputs.todo == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Garmin Connect library
        if: steps.plan.outputs.todo == '1'
        run: pip install --quiet "garminconnect==0.3.20"

      - name: Restore saved Garmin sign-in
        if: steps.plan.outputs.todo == '1'
        uses: actions/cache/restore@v4
        with:
          path: .garmin_tokens
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: garmin-tokens-

      - name: Send to Garmin
        if: steps.plan.outputs.todo == '1'
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python3 scripts/garmin_workouts.py apply /tmp/spec.json

      - name: Save Garmin sign-in for next time
        if: always() && steps.plan.outputs.todo == '1' && hashFiles('.garmin_tokens/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .garmin_tokens
          key: garmin-tokens-${{ github.run_id }}

      - name: Save what was sent
        if: always() && steps.plan.outputs.todo == '1'
        run: |
          git config user.name "garmin-sync"
          git config user.email "garmin-sync@users.noreply.github.com"
          git add garmin/watch.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Watch workouts $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 5
          done
          exit 1
