name: Garmin sync

on:
  schedule:
    - cron: "23 * * * *"   # every hour at :23 (GitHub may start it a few minutes late)
  workflow_dispatch:         # the app's "Sync now" button starts this
    inputs:
      history_days:
        description: "Re-pull this many days of history (leave empty for a normal sync)"
        required: false
        default: ""
      probe:
        description: "Print field names Garmin returns (no values), for troubleshooting"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Pull Garmin data
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          HISTORY_DAYS: ${{ github.event.inputs.history_days }}
          PROBE: ${{ github.event.inputs.probe }}
        run: python3 scripts/garmin_sync.py

      - name: Read Google Calendar
        id: cal
        if: always()
        continue-on-error: true
        env:
          GCAL_ICS_URLS: ${{ secrets.GCAL_ICS_URLS }}
        run: python3 scripts/calendar_sync.py

      # Live readings for the Today screen (Body Battery, stress, heart rate, Training Readiness), 5 AM to 11 PM
      - name: Check the hour
        id: hour
        run: |
          h=$(TZ=America/Chicago date +%-H)
          if [ "$h" -ge 5 ] && [ "$h" -le 23 ] && [ -n "${{ secrets.GARMIN_EMAIL }}" ]; then echo "live=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.hour.outputs.live == '1'
        with:
          python-version: "3.12"
      - name: Restore saved Garmin sign-in
        if: steps.hour.outputs.live == '1'
        uses: actions/cache/restore@v4
        with:
          path: .garmin_tokens
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: garmin-tokens-
      - name: Live readings
        if: steps.hour.outputs.live == '1'
        continue-on-error: true
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          pip install --quiet "garminconnect==0.3.20"
          PYTHONPATH=scripts python3 scripts/garmin_extra.py now
      - name: Save Garmin sign-in for next time
        if: steps.hour.outputs.live == '1' && hashFiles('.garmin_tokens/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .garmin_tokens
          key: garmin-tokens-${{ github.run_id }}

      - name: Save changes
        if: always()
        run: |
          git config user.name "garmin-sync"
          git config user.email "garmin-sync@users.noreply.github.com"
          git add garmin/
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git commit -m "Garmin sync $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 5
          done
          exit 1

      - name: Re-send today's watch workouts after a schedule change
        if: steps.cal.outputs.soon == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch-workouts.yml --ref main
