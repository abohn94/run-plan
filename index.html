<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://api.github.com https://ntfy.sh; img-src 'self' data: blob:; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Run Plan">
<title>Run Plan</title>
<meta name="description" content="Personal running and strength plan that adapts to your Garmin recovery data.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Run Plan v2: a clean consumer running-app look. Monochrome interface, colour comes only from workout types.
   Big bold type, pill buttons, soft rounded cards, bottom tab bar. */
:root {
  --bg: #09090b; --bg2: #131316; --card: #17171b; --card2: #202026; --line: #2a2a31; --line2: #3a3a43;
  --ink: #ffffff; --muted: #a0a0ab; --dim: #6c6c78; --inv: #09090b;
  --red: #ff5a4f; --gold: #ffc531; --green: #34d17f; --blue: #5b9dff; --gray: #8a8a95; --violet: #b58cff; --slate: #9fb0c0;
  --amber: #ffab2e; --danger: #ff5a5a;
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 22px; --fs: 15.5px;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f3f3f6; --bg2: #ffffff; --card: #ffffff; --card2: #eeeef2; --line: #e3e3ea; --line2: #cfcfd9;
  --ink: #0b0b0d; --muted: #5d5d69; --dim: #8b8b97; --inv: #ffffff;
  --red: #e2382c; --gold: #c98f00; --green: #128a4b; --blue: #2c68d8; --gray: #6b6b77; --violet: #7a4be0; --slate: #5c7186; --amber: #b86e00; --danger: #d92d2d;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: var(--fs); -webkit-text-size-adjust: 100%; }
html[data-size="1"] { --fs: 17px; } html[data-size="2"] { --fs: 18.5px; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 1rem; line-height: 1.5; min-height: 100vh; font-variant-numeric: tabular-nums; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { letter-spacing: -.025em; line-height: 1.12; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--ink); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }
.mono { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .dim { color: var(--dim); }
.small { font-size: .88rem; } .tiny { font-size: .76rem; }
.eyebrow { font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 30; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 6px; padding: calc(8px + var(--safe-t)) 14px 8px; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.topbar .title { font-weight: 800; font-size: 1rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .right { display: flex; align-items: center; gap: 6px; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--card2); display: inline-grid; place-items: center; flex: none; color: var(--ink); text-decoration: none; }
.iconbtn svg { width: 19px; height: 19px; }
.syncchip { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: 999px; background: var(--card2); font-size: .74rem; font-weight: 700; color: var(--muted); flex: none; }
.syncchip i { width: 8px; height: 8px; border-radius: 50%; background: var(--gray); }
.syncchip[data-s="ok"] i { background: var(--green); }
.syncchip[data-s="busy"] i { background: var(--gold); animation: pulse 1s infinite; }
.syncchip[data-s="err"] i { background: var(--danger); }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .syncchip[data-s="busy"] i { animation: none; } * { scroll-behavior: auto !important; } }

/* bottom tabs */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(6, 1fr); background: color-mix(in srgb, var(--bg2) 94%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 4px 6px calc(4px + var(--safe-b)); }
.tabbar a { display: grid; justify-items: center; gap: 2px; padding: 7px 2px 6px; text-decoration: none; color: var(--dim); font-size: .68rem; font-weight: 700; border-radius: 14px; }
.tabbar a svg { width: 23px; height: 23px; }
.tabbar a[aria-current="page"] { color: var(--ink); }
body.focus .tabbar { display: none; }
@media (min-width: 700px) { .tabbar { left: 50%; right: auto; transform: translateX(-50%); width: 540px; bottom: 16px; border: 1px solid var(--line); border-radius: 26px; padding: 6px; box-shadow: 0 12px 40px rgba(0,0,0,.35); } }

/* layout */
main { max-width: 640px; margin: 0 auto; padding: 6px 16px calc(104px + var(--safe-b)); display: grid; gap: 14px; }
.card { background: var(--card); border-radius: var(--r); padding: 16px; min-width: 0; }
:root[data-theme="light"] .card { box-shadow: 0 1px 2px rgba(20,20,40,.05); }
.card h2 { font-size: 1.3rem; font-weight: 800; }
.card h3 { font-size: 1.05rem; font-weight: 800; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 380px) { .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stack { display: grid; gap: 10px; }
.stack.tight { gap: 6px; }
.hr { height: 1px; background: var(--line); margin: 4px 0; }
.pagehead { padding: 6px 2px 0; }
.pagehead h1 { font-size: 2rem; font-weight: 800; }
.pagehead p { color: var(--muted); margin-top: 6px; }
.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 6px 2px 0; }
.sechead h2 { font-size: 1.25rem; font-weight: 800; }
.sechead a, .sechead button { font-size: .86rem; font-weight: 700; color: var(--muted); text-decoration: none; background: none; border: 0; padding: 0; }

/* buttons, pills, chips */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--card2); color: var(--ink); font-weight: 800; font-size: .94rem; text-decoration: none; }
.btn.primary { background: var(--ink); color: var(--inv); }
.btn.ghost { background: none; box-shadow: inset 0 0 0 1.5px var(--line2); }
.btn.danger { background: none; color: var(--danger); box-shadow: inset 0 0 0 1.5px var(--danger); }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: .84rem; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--inv); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; background: var(--card2); font-size: .78rem; font-weight: 700; }
.pill.teal, .pill.solid { background: var(--ink); color: var(--inv); }
.pill.warn { color: var(--amber); } .pill.bad { color: var(--danger); } .pill.good { color: var(--green); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 0; background: var(--card2); border-radius: 999px; padding: 9px 15px; font-size: .88rem; font-weight: 700; min-height: 40px; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--inv); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--card2); border-radius: 999px; padding: 4px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 9px 4px; font-weight: 800; font-size: .86rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--inv); }

/* workout-type colours */
.t-long { --c: var(--red); } .t-speed { --c: var(--gold); } .t-easy, .t-recovery { --c: var(--green); }
.t-strength { --c: var(--blue); } .t-rest { --c: var(--gray); } .t-cross { --c: var(--slate); } .t-race { --c: var(--violet); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: inline-block; flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--muted); font-weight: 600; padding: 0 2px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.tico { width: 44px; height: 44px; border-radius: 14px; background: color-mix(in srgb, var(--c) 20%, transparent); color: var(--c); display: grid; place-items: center; flex: none; }
.tico svg { width: 22px; height: 22px; }

/* session cards */
.sess { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; align-items: center; background: var(--card); border-radius: 20px; padding: 13px 14px; text-decoration: none; color: inherit; position: relative; overflow: hidden; }
.sess::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); }
.sess .tico { grid-row: 1 / span 2; }
.sess .sh { display: grid; gap: 1px; min-width: 0; }
.sess .lab { font-size: .68rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--c); }
.sess .ti { font-weight: 800; font-size: 1.04rem; letter-spacing: -.01em; }
.sess .meta { font-size: .8rem; color: var(--muted); grid-column: 2; font-weight: 600; }
.sess .big { grid-column: 3; grid-row: 1 / span 2; text-align: right; }
.sess .big b { font-weight: 800; font-size: 1.7rem; letter-spacing: -.04em; line-height: 1; }
.sess .big small { font-size: .74rem; color: var(--muted); font-weight: 700; margin-left: 2px; }
.sess .struct { grid-column: 1 / -1; padding-top: 8px; }
.sess.done { opacity: .55; }
.sess .flag { font-size: .7rem; font-weight: 700; color: var(--amber); }
.sess .tick { position: absolute; right: 12px; top: 10px; width: 20px; height: 20px; border-radius: 50%; background: var(--green); color: #05130b; font-size: .72rem; font-weight: 900; display: grid; place-items: center; }
.structure { display: flex; align-items: flex-end; gap: 2px; height: 34px; }
.structure i { display: block; border-radius: 4px 4px 2px 2px; min-width: 2px; }
.structure.lg { height: 76px; gap: 3px; }

/* today */
.greet { padding: 8px 2px 0; }
.greet .date { font-size: .8rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.greet h1 { font-size: 2.1rem; font-weight: 800; margin-top: 2px; }
.herow { border-radius: 26px; padding: 18px; background: linear-gradient(150deg, color-mix(in srgb, var(--c) 38%, var(--card)) 0%, var(--card) 70%); display: grid; gap: 12px; text-decoration: none; color: inherit; position: relative; }
.herow .lab { font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
:root[data-theme="light"] .herow .lab { color: var(--ink); }
.herow h2 { font-size: 1.75rem; font-weight: 800; }
.herow .nums { display: flex; gap: 18px; flex-wrap: wrap; }
.herow .nums div b { display: block; font-size: 1.5rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
.herow .nums div span { font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.bar { height: 8px; border-radius: 999px; background: var(--card2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--ink); }
.wkprog .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.wkprog .top b { font-size: 1.05rem; font-weight: 800; }
.ring { width: 84px; height: 84px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 1.6rem; letter-spacing: -.03em; }
.ring small { display: none; }
.lv-green { --lv: var(--green); } .lv-amber { --lv: var(--amber); } .lv-red { --lv: var(--danger); } .lv-none { --lv: var(--gray); }
.metric { background: var(--card2); border-radius: 16px; padding: 10px 12px; min-width: 0; }
.metric span { display: block; font-size: .66rem; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.metric b { font-weight: 800; font-size: 1.2rem; letter-spacing: -.02em; }
.metric em { display: block; font-style: normal; font-size: .72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metric.warn b { color: var(--amber); } .metric.bad b { color: var(--danger); } .metric.good b { color: var(--green); }
.grid3 .metric b { font-size: 1.05rem; }
.advice .eyebrow { color: var(--lv); }
.reasons { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: .88rem; }
.weekstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.weekstrip a { display: grid; justify-items: center; gap: 5px; padding: 8px 0; border-radius: 16px; text-decoration: none; color: var(--muted); font-size: .72rem; font-weight: 800; }
.weekstrip a span.n { font-size: .95rem; color: var(--ink); }
.weekstrip a.today { background: var(--ink); color: var(--inv); }
.weekstrip a.today span.n { color: var(--inv); }
.weekstrip .dots { display: flex; gap: 3px; min-height: 8px; }
.weekstrip .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.weekstrip .dots i.dn { box-shadow: 0 0 0 2px var(--card), 0 0 0 3.5px var(--c); }

/* plan */
.season { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(3px, 1fr); gap: 2px; align-items: end; height: 96px; }
.season button { border: 0; padding: 0; background: none; height: 100%; display: flex; align-items: flex-end; position: relative; }
.season button i { display: block; width: 100%; border-radius: 3px 3px 0 0; background: var(--line2); }
.season button.cut i { background: var(--line); }
.season button.race i { background: var(--violet); }
.season button.past i { background: var(--dim); }
.season button.cur i { background: var(--ink); }
.season button b { position: absolute; left: 15%; right: 15%; bottom: 0; background: var(--green); border-radius: 2px 2px 0 0; }
.phasebar { display: grid; grid-auto-flow: column; gap: 2px; margin-top: 6px; }
.phasebar span { font-size: .6rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-top: 2px solid var(--line2); padding-top: 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: center; }
.pager { display: grid; grid-template-columns: 46px 1fr 46px; align-items: center; gap: 8px; text-align: center; }
.pager h2 { font-size: 1.7rem; font-weight: 800; }
.pager .ph { font-size: .74rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.pager .iconbtn { width: 46px; height: 46px; font-size: 1.3rem; font-weight: 800; }
.pager .iconbtn[disabled] { opacity: .3; }
.dayblock { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start; }
.dayblock .d { text-align: center; padding-top: 10px; font-size: .7rem; font-weight: 800; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; }
.dayblock .d b { display: block; font-size: 1.25rem; color: var(--ink); letter-spacing: -.02em; }
.dayblock.today .d b { background: var(--ink); color: var(--inv); border-radius: 12px; margin: 0 4px; }
.dayblock .items { display: grid; gap: 8px; min-width: 0; }
.restrow { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 20px; background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--muted); font-weight: 700; font-size: .92rem; text-decoration: none; }
.banner { background: var(--card2); border-radius: 16px; padding: 11px 14px; font-size: .9rem; }
.banner.warn { box-shadow: inset 3px 0 0 var(--amber); }
.banner.info { box-shadow: inset 3px 0 0 var(--line2); }
.racecard { border-radius: 26px; padding: 18px; background: linear-gradient(150deg, color-mix(in srgb, var(--violet) 40%, var(--card)), var(--card) 75%); display: grid; gap: 4px; text-decoration: none; color: inherit; }
.racecard .cd { font-size: 2.6rem; font-weight: 800; letter-spacing: -.04em; line-height: 1; }

/* session detail */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.steps li { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: start; }
.steps li .z { width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; }
.steps li .pc { font-weight: 800; font-size: .86rem; text-align: right; white-space: nowrap; }
.steps li .pc .muted { font-weight: 600; }
.steps li .rc { grid-column: 2 / span 2; font-size: .8rem; color: var(--muted); margin-top: -6px; }
.ex { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.ex:first-child { border-top: 0; }
.ex .n { font-weight: 700; }
.ex .rx { font-weight: 800; font-size: .88rem; text-align: right; }
.ex .cue { color: var(--muted); font-size: .84rem; grid-column: 1 / -1; }
.block-h { font-size: .7rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; margin-top: 12px; }
.detail { border-radius: 26px; padding: 18px; background: linear-gradient(160deg, color-mix(in srgb, var(--c) 22%, var(--card)) 0%, var(--card) 45%); }

/* accordion */
details.acc { background: var(--card); border-radius: var(--r); }
details.acc > summary { list-style: none; cursor: pointer; padding: 15px 16px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
details.acc > summary::-webkit-details-marker { display: none; }
details.acc > summary::after { content: '+'; font-weight: 700; font-size: 1.3rem; color: var(--muted); }
details.acc[open] > summary::after { content: '–'; }
details.acc .body { padding: 0 16px 16px; display: grid; gap: 10px; }

/* forms */
label.f { display: grid; gap: 6px; font-size: .8rem; font-weight: 700; color: var(--muted); min-width: 0; }
input.i, select.i, textarea.i { width: 100%; min-width: 0; border: 0; box-shadow: inset 0 0 0 1.5px var(--line2); background: var(--bg2); color: var(--ink); border-radius: 14px; padding: 12px 13px; font-size: 16px; font-weight: 600; }
input.i:focus, select.i:focus { outline: none; box-shadow: inset 0 0 0 2px var(--ink); }
textarea.i { min-height: 72px; resize: vertical; }
.check { display: flex; align-items: center; gap: 10px; font-size: .94rem; font-weight: 600; }
.check input { width: 22px; height: 22px; accent-color: var(--ink); flex: none; }
.rpe { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.rpe button { border: 0; background: var(--card2); border-radius: 12px; min-height: 40px; font-weight: 800; font-size: .88rem; }
.rpe button[aria-pressed="true"] { background: var(--ink); color: var(--inv); }
.err { color: var(--danger); font-size: .86rem; font-weight: 700; }
.ok-msg { color: var(--green); font-size: .86rem; font-weight: 700; }

/* sheets */
.sheet { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.62); display: flex; align-items: flex-end; justify-content: center; }
.sheet-card { width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--bg2); border-radius: 28px 28px 0 0; padding: 16px 18px calc(20px + var(--safe-b)); display: grid; gap: 12px; }
@media (min-width: 640px) { .sheet { align-items: center; } .sheet-card { border-radius: 28px; } }
.sheet-card h3 { font-size: 1.45rem; font-weight: 800; }
.grabber { width: 40px; height: 4px; border-radius: 2px; background: var(--line2); margin: -4px auto 2px; }

/* coach */
.thread { display: grid; gap: 10px; }
.msg { max-width: 88%; padding: 11px 14px; border-radius: 20px; font-size: .95rem; white-space: pre-line; }
.msg.me { justify-self: end; background: var(--ink); color: var(--inv); border-bottom-right-radius: 6px; font-weight: 600; }
.msg.coach { justify-self: start; background: var(--card); border-bottom-left-radius: 6px; }
.msg .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; white-space: normal; }
.msg time { display: block; font-size: .66rem; opacity: .6; margin-top: 4px; font-weight: 600; }

<script>
/* Run Plan engine: dates, paces, training styles, plan generator, adaptations,
   readiness, nutrition, analysis and Garmin FIT export. Pure functions, no DOM. */
(function (root) {
'use strict';

var MI_M = 1609.344;
var DOW_ABS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], DOW_LONG_ABS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
var DOW = DOW_ABS.slice(), DOW_LONG = DOW_LONG_ABS.slice();
/* Weeks can start on any day. WS: 0 = Monday ... 6 = Sunday. Day indexes everywhere are relative to it. */
var WS = 0;
function setWeekStart(k) { k = ((+k || 0) % 7 + 7) % 7; WS = k; for (var i = 0; i < 7; i++) { DOW[i] = DOW_ABS[(i + k) % 7]; DOW_LONG[i] = DOW_LONG_ABS[(i + k) % 7]; } return k; }
/* keep the same real weekdays when the week start changes: avail[] and longDay are stored relative to the week start */
function rotateProfile(p, to) {
  var from = +p.weekStart || 0, d = ((to - from) % 7 + 7) % 7; if (!d) { p.weekStart = to; return p; }
  if (p.avail) p.avail = p.avail.map(function (x, i) { return p.avail[(i + d) % 7]; });
  if (p.longDay != null) p.longDay = ((+p.longDay - d) % 7 + 7) % 7;
  p.weekStart = to; return p;

        if (local[k] && local[k][sub] !== undefined) remote[k][sub] = local[k][sub]; else delete remote[k][sub];
      }
    });
    return remote;
  },
  keepTouched: function () { LS.set(K.touched, JSON.stringify(this.touched)); },
  queueSave: function (ms) {
    var self = this;
    clearTimeout(this._timer);
    if (this.mode !== 'github') { this.setStatus('ok'); return; }
    this._timer = setTimeout(function () { self.save(); }, ms == null ? 1200 : ms);
  },
  save: function () {
    var self = this;
    if (this.mode !== 'github') return Promise.resolve();
    if (this._saving) { this._again = true; return this._saving; }
    var touchedNow = this.touched;
    this.touched = {};
    this.setStatus('saving');
    var body = { message: 'Run Plan update ' + new Date().toISOString().slice(0, 16), content: b64enc(JSON.stringify(this.state, null, 1)) };
    if (this.sha) body.sha = this.sha;
    if (this.conn.branch) body.branch = this.conn.branch;
    this._saving = this.api('/contents/' + STATE_PATH, { method: 'PUT', body: body }).then(function (r) {
      if (r.status === 409 || r.status === 422) {
        /* someone else saved first: re-read, merge our changes on top, then save again */
        Object.keys(touchedNow).forEach(function (k) { self.touched[k] = true; });
        return self.getFile(STATE_PATH).then(function (s) {
          if (s) { self.state = self.merge(normalize(JSON.parse(s.text || '{}'))); self.sha = s.sha; }
          self._again = true;
        });
      }
      if (!r.ok) throw new Error('Could not save to GitHub (' + r.status + ')');
      return r.json().then(function (j) { self.sha = j.content && j.content.sha; LS.set(K.sha, self.sha || ''); self.keepTouched(); self.setStatus('ok'); });
    }).catch(function (e) {
      Object.keys(touchedNow).forEach(function (k) { self.touched[k] = true; });
      self.keepTouched();
      self.setStatus(navigator.onLine === false ? 'offline' : 'error', e.message);
    }).then(function () {
      self._saving = null;
      if (self._again) { self._again = false; return self.save(); }
    });
    return this._saving;
  },
  connect: function (conn) {
    var self = this;
    var prev = this.conn;
    this.conn = conn;
    return this.api('').then(function (r) {
      if (!r.ok) throw new Error(r.status === 404 ? 'Repository not found, or the token cannot see it.' : 'GitHub said ' + r.status + '. Check the token.');
      return r.json();
    }).then(function (j) {
      if (j.private === false) throw new Error('That repository is public. Use a private repository so your health data stays private.');
      LS.set(K.conn, JSON.stringify(conn));
      self.mode = 'github';
      /* first connection: keep whatever was entered on this device, then merge with the repository */
      if (self.state && (self.state.profile || self.state.events.length)) { Object.keys(emptyState()).forEach(function (k) { self.touched[k] = true; }); }
      return self.pull();
    }).catch(function (e) { self.conn = prev; throw e; });
  },
  disconnect: function () { LS.del(K.conn); LS.del(K.sha); LS.del(K.touched); this.conn = null; this.mode = 'local'; this.sha = null; this.setStatus('ok'); },
  syncNow: function () {
    var self = this;
    if (this.mode !== 'github') return Promise.reject(new Error('Connect GitHub first.'));
    return this.api('/actions/workflows/' + WORKFLOW + '/dispatches', { method: 'POST', body: { ref: this.conn.branch || 'main' } }).then(function (r) {
      if (r.status === 204) return true;
      if (r.status === 403 || r.status === 404) throw new Error('The token needs the Actions (read and write) permission to start a sync.');
      throw new Error('GitHub said ' + r.status);
    });
  },
  lastRun: function () {
    if (this.mode !== 'github') return Promise.resolve(null);
    return this.api('/actions/workflows/' + WORKFLOW + '/runs?per_page=1').then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      var w = j && j.workflow_runs && j.workflow_runs[0];
      return w ? { status: w.status, conclusion: w.conclusion, at: w.updated_at || w.created_at, url: w.html_url, event: w.event } : null;
    }).catch(function () { return null; });
  },
  replaceAll: function (s) {
    this.state = normalize(s);
    Object.keys(emptyState()).forEach(function (k) { Store.touched[k] = true; });
    LS.set(K.state, JSON.stringify(this.state));
    this.queueSave(0);
    if (this.onchange) this.onchange('edit');
  },
  setGarminLocal: function (g) { this.garmin = g; LS.set(K.garmin, JSON.stringify(g)); if (this.onchange) this.onchange('garmin'); }
};
Store.emptyState = emptyState;
Store.normalize = normalize;
Store.LS = LS;
root.Store = Store;
if (typeof module !== 'undefined' && module.exports) module.exports = Store;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/* Coach: a rule-based training assistant. No AI service, no cost.
   reply(text, ctx) -> { text, actions: [{label, act}] } */
(function (root) {
'use strict';
var E = root.ENGINE || (typeof require !== 'undefined' ? require('./engine.js') : null);
var DAYS = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];

function pz(z, ctx) { var p = ctx.zones && ctx.zones[z]; return p ? E.fmtPace(p[0]) + '–' + E.fmtPace(p[1]) + '/mi' : '—'; }
function hrz(z, ctx) { var h = ctx.zones && ctx.zones.hr && ctx.zones.hr[z]; return h ? ' (about ' + (h[0] ? h[0] + '–' : 'under ') + h[1] + ' bpm)' : ''; }
function A(label, act) { return { label: label, act: act }; }
function num(text) { var m = /(\d+)/.exec(text); return m ? +m[1] : null; }
function dayIn(text) { for (var i = 0; i < 7; i++) if (text.indexOf(DAYS[i]) >= 0 || new RegExp('\\b' + DAYS[i].slice(0, 3) + '\\b').test(text)) return i; return -1; }

function describeDay(day, ctx) {
  if (!day) return 'Nothing is scheduled.';
  return day.parts.map(function (p) {
    if (p.type === 'rest') return p.title;
    if (p.type === 'strength') return p.title + ' (' + p.min + ' min)';
    if (p.type === 'cross') return p.title + ' (' + p.min + ' min)';
    return p.title + ', ' + E.round1(p.mi) + ' mi';
  }).join(' + ');
}

var KB = [
  { id: 'zones', title: 'My training paces', keys: /\b(pace|paces|zones?|how fast|easy pace|tempo pace|threshold pace|interval pace)\b/,
    a: function (c) { return 'Your current paces (they update from your runs, time trials and threshold tests):\n• Easy: ' + pz('E', c) + hrz('E', c) + '\n• Steady: ' + pz('S', c) + '\n• Marathon pace: ' + pz('M', c) + '\n• Threshold: ' + pz('T', c) + hrz('T', c) + '\n• Intervals: ' + pz('I', c) + '\n• Goal race pace: ' + pz('G', c) + '\nEasy days should feel like you could chat in full sentences. If you can\'t, slow down — the pace is a ceiling, not a target.'; },
    actions: [A('Open pace & HR zones', { nav: '#/zones' })] },
  { id: 'threshold', title: 'Lactate threshold explained', keys: /\b(lactate|threshold|tempo|cruise)\b/,
    a: function (c) { return 'Lactate threshold is roughly the fastest pace you could hold for about an hour. Training right at it (not faster) teaches your body to clear lactate and is the single best way to turn your aerobic base into speed.\n\nYour threshold pace is ' + pz('T', c) + hrz('T', c) + '. It should feel "comfortably hard": you can say a short sentence. If the last rep is a fight, you went too fast.\n\nIf you get a new lactate threshold estimate from your watch or a lab test, add it under Pace & HR zones and your threshold workouts will use it.'; },
    actions: [A('Add a threshold or VO2max reading', { sheet: 'metrics' })] },
  { id: 'vo2', title: 'VO2max and intervals', keys: /\b(vo2|v02|vo2max|intervals?|repeats?)\b/,
    a: function (c) { return 'VO2max is the ceiling of your aerobic engine. Interval sessions at about 5K effort (' + pz('I', c) + ') push that ceiling up. Your Garmin estimates VO2max, but Garmin\'s personal API doesn\'t share it, so add it by hand when it changes. The app counts it at half weight because watch estimates wander; a race or time trial counts fully.'; },
    actions: [A('Update VO2max', { sheet: 'metrics' })] },
  { id: 'long', title: 'Long run tips', keys: /\b(long run|long runs|longest)\b/,
    a: function (c) { return 'Long runs build endurance, durability and fueling skills. Keep them conversational unless the plan adds a faster finish. Over 75 minutes, take 30–60 g of carbs per hour (a gel every 30–40 minutes) and drink to thirst. Practice your race breakfast and shoes on the big ones.' + (c.nextLong ? '\n\nYour next long run: ' + c.nextLong + '.' : ''); } },
  { id: 'shin', title: 'Shin splints', keys: /\b(shin|shins|tibia|splint)/,
    a: function () { return 'Shin pain is a load problem: the lower leg is getting more stress than it can adapt to yet.\n• Pain under 3/10 that fades as you warm up: run easy and shorter on soft ground, skip hills and speed for a few days, and do the shin routine daily.\n• Pain 4/10+, pain when walking, a sharp spot on the bone, or night pain: stop running, walk on the treadmill only if pain-free, and get it checked to rule out a stress injury.\nTell me how bad it is and I\'ll adjust the plan.'; },
    actions: [A('Mild — mark a niggle', { life: { kind: 'injured', level: 'modified' } }), A('Bad — stop running', { life: { kind: 'injured', level: 'out' } }), A('Open the shin routine', { nav: '#/shins' })] },
  { id: 'pain', title: 'Aches and pains', keys: /\b(pain|hurts?|injur|achilles|calf|knee|hip|foot|ankle|hamstring|it band|plantar|sore spot|tweak)/,
    a: function () { return 'Sorry it hurts. A quick rule: if pain is 3/10 or less, doesn\'t change how you run, and settles within 24 hours, run easy and short. If it\'s sharp, getting worse, makes you limp, or is on one spot of bone, stop running, walk only if it is pain-free, and see a clinician if it lasts more than a few days. I\'ll ease the plan either way.'; },
    actions: [A('Niggle: ease this week', { life: { kind: 'injured', level: 'modified' } }), A('No running for now', { life: { kind: 'injured', level: 'out' } }), A('Log a check-in', { sheet: 'checkin' })] },
  { id: 'sick', title: 'Running when sick', keys: /\b(sick|ill|cold|flu|covid|fever|virus|stomach|congest)/,
    a: function () { return 'The "neck check": symptoms only above the neck (stuffy nose, mild sore throat) — an easy run or walk is usually fine. Fever, chest symptoms, body aches or stomach bugs — rest completely and return 24 hours after the fever is gone. The plan ramps you back in afterwards; never try to make up missed runs.'; },
    actions: [A('Mild: a few easy days', { life: { kind: 'sick', level: 'mild' } }), A('Out for the week', { life: { kind: 'sick', level: 'severe' } })] },
  { id: 'missed', title: 'Missed a run', keys: /\b(missed|skip|skipped|didn.t run|couldn.t run|no time)\b/,
    a: function () { return 'Let it go — one missed run changes nothing. Don\'t double up or squeeze it into a rest day. If it was the key workout or long run and you have a free day later this week (not the day before the long run), move it there. Otherwise just carry on.'; },
    actions: [A('Open this week', { nav: '#/plan' })] },
  { id: 'tired', title: 'Feeling tired or flat', keys: /\b(tired|fatigue|exhausted|flat|heavy legs|drained|burn ?out|run down|overtrain)/,
    a: function (c) { return 'Tiredness is useful information. ' + (c.rd ? 'Today\'s readiness is ' + c.rd.level.toUpperCase() + (c.rd.reasons.length ? ': ' + c.rd.reasons.map(function (r) { return r.text; }).join(' ') : '.') + ' ' : '') + 'One flat day: keep easy runs easy and lift light. Several in a row, with low HRV or high resting heart rate: take a down day or two. Fitness is built during recovery, not during the run.'; },
    actions: [A('Do a check-in', { sheet: 'checkin' }), A('Make today easy', { override: 'easy' })] },
  { id: 'sleep', title: 'Sleep', keys: /\b(sleep|insomnia|night shift|nights|slept)/,
    a: function (c) { var s = c.rd && c.rd.metrics.sleep; return (s ? 'Last night: ' + E.round1(s.v) + ' h' + (s.score ? ', score ' + s.score : '') + '. ' : '') + 'Aim for 7–9 hours, most of all after long runs and hard days. On short nights, keep runs easy and caffeine before noon. Working nights? Anchor a regular sleep block, protect it with blackout curtains, and schedule key workouts on your best-rested days — tell me your shifts as "busy" days and the plan will move runs around them.'; },
    actions: [A('Mark busy days', { sheet: 'life' })] },
  { id: 'hrv', title: 'HRV', keys: /\bhrv|heart rate variability/,
    a: function (c) { var h = c.rd && c.rd.metrics.hrv; return (h ? 'Last night\'s HRV: ' + h.v + ' ms' + (h.lo ? ' (your normal range ' + h.lo + '–' + h.hi + ')' : '') + '. ' : '') + 'HRV reflects how recovered your nervous system is. One low night isn\'t a problem; a few in a row — especially with a higher resting heart rate — means back off. The app compares you only to your own baseline.'; } },
  { id: 'rhr', title: 'Resting heart rate', keys: /\b(resting heart|rhr|resting hr)/,
    a: function (c) { var r = c.rd && c.rd.metrics.rhr; return (r ? 'This morning: ' + r.v + ' bpm' + (r.base ? ' against a normal of about ' + Math.round(r.base) : '') + '. ' : '') + 'A resting heart rate 5+ bpm above your normal often means fatigue, illness, heat, alcohol or stress. The app eases the day when that happens.'; } },
  { id: 'bb', title: 'Body Battery', keys: /\bbody battery\b/,
    a: function (c) { var b = c.rd && c.rd.metrics.bb; return (b ? 'Your Body Battery peaked at ' + b.v + ' today. ' : '') + 'Below about 45, keep the day easy; below 25, rest. It\'s a blend of HRV, stress and sleep, so treat it as one input alongside how you feel.'; } },
  { id: 'fuel', title: 'Fueling and nutrition', keys: /\b(eat|food|fuel|gel|gels|carb|carbs|protein|nutrition|diet|breakfast|calories|macros|hungry)\b/,
    a: function (c) { var n = c.nutrition; return (n ? 'Today is a ' + n.tier.toLowerCase() + ' training day' + (n.carbG ? ': about ' + n.carbG[0] + '–' + n.carbG[1] + ' g carbs and ' + n.protG[0] + '–' + n.protG[1] + ' g protein' : ': about ' + n.carbGkg[0] + '–' + n.carbGkg[1] + ' g carbs per kg body weight') + '. ' : '') + 'Carbs fuel running; protein (spread over 3–4 meals) repairs muscle from lifting. Before runs over an hour, eat a familiar carb meal 2–3 hours ahead. During long runs, 30–60 g carbs per hour. After hard days, carbs plus 20–30 g protein within an hour.'; },
    actions: [A('Open nutrition', { nav: '#/nutrition' })] },
  { id: 'hydration', title: 'Hydration, heat and humidity', keys: /\b(water|hydrat|electrolyte|salt|sodium|heat|hot|humid|sweat)/,
    a: function () { return 'Drink to thirst on most runs. On runs over an hour or in heat, aim for 400–800 ml per hour with sodium (300–600 mg/h). In heat, slow easy and long-run paces by 15–30 s/mi or more and run by effort and heart rate.'; } },
  { id: 'winter', title: 'Cold, snow and treadmills', keys: /\b(cold|snow|ice|icy|winter|freez|treadmill|wind ?chill|dreadmill)/,
    a: function () { return 'Winter running: dress for 15–20 °F warmer than it is, cover hands and ears, and use traction devices on ice. Slippery footing raises shin and calf strain, so slow down or move speed work indoors. Treadmill: set a 1% incline to feel like outdoors, and run by effort if the speed seems off. Both count the same in the plan — your watch records them.'; } },
  { id: 'strength', title: 'Lifting and running together', keys: /\b(lift|lifting|gym|weights|strength|squat|deadlift|bench|press)\b/,
    a: function (c) { return 'Lifting heavy twice a week makes you a more durable, more economical runner. Rules of thumb:\n• Hard days hard: lift on your key-run day, after the run (or 6+ hours apart).\n• Keep the day before the long run free of heavy legs.\n• Leave 2–3 reps in the tank in run-heavy weeks; drop sets in taper and race weeks.\nYou currently lift ' + (c.profile ? c.profile.liftDays : 2) + ' days a week. Want to change it?'; },
    actions: [A('Lift 2 days', { profile: { liftDays: 2 } }), A('Lift 3 days', { profile: { liftDays: 3 } }), A('Lift 4 days', { profile: { liftDays: 4 } }), A('Open strength', { nav: '#/strength' })] },
  { id: 'cross', title: 'Gym days', keys: /\b(cross|gym day|gym days|treadmill run|bike|elliptical|rower)\b/,
    a: function () { return 'Your extra training days are gym days: a lifting session plus a short, easy treadmill run at 1% incline. They add strength and a few easy miles without another hard run. Keep the treadmill run conversational, and keep heavy legs away from the day before your long run.'; },
    actions: [A('1 gym day a week', { profile: { crossDays: 1 } }), A('2 gym days', { profile: { crossDays: 2 } }), A('Gym days guide', { nav: '#/cross' })] },
  { id: 'taper', title: 'Tapering', keys: /\b(taper|tapering)\b/,
    a: function () { return 'In the taper, mileage drops but some pace stays, so your legs stay sharp while fatigue drains away. Feeling restless, heavy or a bit flat is normal. Don\'t add extra runs, don\'t try new foods, and sleep as much as you can.'; } },
  { id: 'race', title: 'Race day', keys: /\b(race day|race morning|race plan|pacing strategy|start line|negative split|pace the race)/,
    a: function (c) { return 'Race plan: eat a familiar breakfast 2–3 hours before, warm up (shorter for longer races), and start 5–10 s/mi slower than goal pace for the first 2 miles. Settle into goal pace (' + pz('G', c) + '), then race the final third. Fuel early in the half and marathon. Nothing new on race day.'; } },
  { id: 'shoes', title: 'Shoes', keys: /\b(shoe|shoes|sneaker|super ?shoe|carbon plate)/,
    a: function () { return 'Rotate two pairs if you can, retire them around 300–500 miles or when the cushioning feels flat, and save carbon-plated shoes for races and a few key sessions. Rotating shoes slightly changes the loading pattern, which is kind to shins.'; } },
  { id: 'form', title: 'Cadence and form', keys: /\b(cadence|form|stride|overstrid|heel strike|foot strike)/,
    a: function () { return 'If you overstride, a cadence about 5% higher than your current number shortens each step and lowers load on the shins and knees. Run tall, land with your foot under you, and keep your arms relaxed. Strides twice a week are the easiest form drill.'; } },
  { id: 'tt', title: 'Time trials and fitness checks', keys: /\b(time trial|fitness test|5k test|test my fitness)/,
    a: function () { return 'A 5K time trial (or any race) resets every pace in the app. Warm up 1–2 miles with strides, run the 5K as evenly as you can, then log it as a race or time trial with the 5K time.'; } },
  { id: 'adapt', title: 'How the plan adapts', keys: /\b(adapt|adjust|garmin|sync|how does|how do you|recommend)/,
    a: function () { return 'Each morning the app reads your Garmin sleep, HRV, resting heart rate and Body Battery, plus your check-in and recent training load. If they look off, it suggests an easier version of today (you choose). Your logged runs tune your paces: effort ratings, heart rate on easy runs, time trials, and any threshold or VO2max values you add. Life events (travel, busy days, illness, niggles) reshape the week, and missed weeks ramp you back in gradually.'; } },
  { id: 'motivation', title: 'Motivation', keys: /\b(motivat|unmotivated|bored|lazy|don.t feel like|mental)/,
    a: function () { return 'Motivation follows action. Shrink the goal: put on your shoes and run 10 easy minutes — you can stop after that. Change the route, run with a friend or podcast, or swap an easy run for a gym day. And look at the Progress tab: the trend is the reward.'; } }
];

function intent(text, ctx) {
  var t = text.toLowerCase();
  /* plan feedback with direct changes */
  if (/\b(too hard|too much|overwhelm|can.t keep up|struggling|exhausting)\b/.test(t)) {
    return { text: 'Thanks for telling me — that matters more than any number. I can lower your planned mileage by about 10%, switch to a gentler training style, or ease just this week.', actions: [A('Lower mileage 10%', { profile: { volume: Math.max(0.7, E.round1(((ctx.profile && ctx.profile.volume) || 1) - 0.1)) } }), A('Ease this week', { life: { kind: 'busy', level: 'light' } }), A('Change training style', { nav: '#/style' })] };
  }
  if (/\b(too easy|more mileage|more miles|harder|not enough)\b/.test(t)) {
    return { text: 'Good sign! I can raise your planned mileage by about 10%. Increases are still ramped gradually and cutback weeks stay in, so it\'s safe for your shins.', actions: [A('Raise mileage 10%', { profile: { volume: Math.min(1.3, E.round1(((ctx.profile && ctx.profile.volume) || 1) + 0.1)) } }), A('Change training style', { nav: '#/style' })] };
  }
  if (/long run/.test(t) && /(move|change|switch|on|prefer)/.test(t) && dayIn(t) >= 0) {
    var d = dayIn(t);
    return { text: 'Move your long runs to ' + E.DOW_LONG[d] + '? The rest of the week rearranges around it.', actions: [A('Yes, long runs on ' + E.DOW[d], { profile: { longDay: d } })] };
  }
  if (/(run|runs|running)\b.*\b(days|times)\b.*\b(week|wk)\b|\b\d\s*(runs|run days)\b/.test(t) && num(t)) {
    var n = E.clamp(num(t), 3, 7);
    return { text: 'Set your plan to at most ' + n + ' runs a week? Mileage is spread across those days.', actions: [A(n + ' runs a week', { profile: { runDays: n } })] };
  }
  if (/(lift|gym|strength)/.test(t) && /(days|times|x)\b/.test(t) && num(t) != null) {
    var k = E.clamp(num(t), 0, 4);
    return { text: 'Lift ' + k + ' days a week? I\'ll place them on hard days first and keep heavy legs away from the day before your long run.', actions: [A('Lift ' + k + ' days', { profile: { liftDays: k } })] };
  }
  if (/\b(travel|trip|vacation|holiday|wedding|busy|work|shift|on call|conference|move day)\b/.test(t)) {
    return { text: 'Life happens — let\'s plan around it. Tell me the dates and I\'ll move key runs to your free days, or lighten the week if you\'re away for 3+ days.', actions: [A('Add dates', { sheet: 'life' })] };
  }
  if (/\b(race|event|marathon|half|5k|10k)\b/.test(t) && /\b(add|signed up|new|registered|another)\b/.test(t)) {
    return { text: 'Nice! Add it under Goals & races. A-races get a full build and taper; B- and C-races slot in as tune-ups without derailing the plan.', actions: [A('Add a race', { nav: '#/goals' })] };
  }
  if (/\b(today|todays|today.s)\b/.test(t) && /\b(what|workout|run|plan|do)\b/.test(t)) {
    return { text: 'Today: ' + describeDay(ctx.todayDay, ctx) + '.' + (ctx.rec && ctx.rec.headline ? '\n' + ctx.rec.headline + ' — ' + ctx.rec.body : ''), actions: [A('Open today', { nav: '#/today' })] };
  }
  if (/\btomorrow\b/.test(t)) return { text: 'Tomorrow: ' + describeDay(ctx.tomorrowDay, ctx) + '.', actions: [] };
  if (/\b(this week|week look|my week)\b/.test(t)) return { text: ctx.weekSummary || 'Open the Plan tab to see the week.', actions: [A('Open this week', { nav: '#/plan' })] };
  return null;
}

function reply(text, ctx) {
  var t = String(text || '').trim();
  if (!t) return { text: 'Ask me anything about your training, or tap a quick action below.', actions: [] };
  var i = intent(t, ctx);
  if (i) return i;
  var lower = t.toLowerCase();
  var hits = KB.filter(function (k) { return k.keys.test(lower); });
  if (hits.length) {
    var k = hits[0];
    var more = hits.slice(1, 3).map(function (h) { return A(h.title, { ask: h.title }); });
    return { text: k.a(ctx), actions: (k.actions || []).concat(more) };
  }
  return { text: 'I\'m a built-in coach, so I understand training topics like paces, threshold, long runs, shins, sickness, sleep, HRV, fueling, lifting, gym days, taper and race day — and I can change your plan when you tell me about schedule changes, how hard it feels, or how many days you want to run or lift.\n\nFor anything bigger, tap "Copy for Claude": it copies your plan and recent data so you can paste it into the Claude app.', actions: [A('Copy for Claude', { copy: true }), A('Do a check-in', { sheet: 'checkin' })] };
}

/* Reply after a check-in. */
function afterCheckin(c, rd, rec) {

/* ---------- training balance (Garmin load focus) ---------- */
